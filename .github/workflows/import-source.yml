name: Import Hero Run 2 source
on:
  push:
    branches: [main]
    paths:
      - "source-parts/part-11.b64"
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and extract project
        run: |
          cat source-parts/part-*.b64 | base64 --decode > Hero_Run_2_WebOnly.zip
          mkdir -p /tmp/hero-run-2
          unzip -oq Hero_Run_2_WebOnly.zip -d /tmp/hero-run-2
          rsync -a --exclude='README.md' /tmp/hero-run-2/hero-run-2/ ./
          rm -rf source-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Upload Hero Run 2 browser game source"
            git push
          fi
