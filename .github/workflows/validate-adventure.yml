name: Validate Hero Run adventure
on:
  push:
    branches:
      - feature/time-travel-adventure-threejs
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify PWA files are copied into the build
        run: |
          test -f dist/service-worker.js
          test -f dist/manifest.webmanifest
          test -f dist/.vite/manifest.json
      - name: Verify production JavaScript chunk budgets
        run: npm run verify:build
