name: Export Hero Run 2 production build

on:
  push:
    branches: [main]
    paths-ignore:
      - "build-export/**"

permissions:
  contents: write

jobs:
  export-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests and build
        run: |
          npm test
          npm run build
      - name: Publish built files to a separate export branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Export Hero Run 2 production build"
          git branch -M build-dist
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
