name: Hero Run Three.js CI
on:
  push:
    branches: [main, hero-run-threejs-v3]
    paths: ['hero-run-threejs/**', '.github/workflows/hero-run-threejs-ci.yml']
  pull_request:
    paths: ['hero-run-threejs/**', '.github/workflows/hero-run-threejs-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hero-run-threejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hero-run-threejs/package.json
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
