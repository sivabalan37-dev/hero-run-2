name: Build Hero Run Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/time-travel-adventure-threejs
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "styles.css"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Set Android game orientation to landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          for activity in root.findall("application/activity"):
              if activity.get(android_ns + "name", "").endswith("MainActivity"):
                  activity.set(android_ns + "screenOrientation", "sensorLandscape")
                  break
          else:
              raise SystemExit("Capacitor MainActivity not found in AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hero-run-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
