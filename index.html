<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10243a" />
    <meta name="description" content="Hero Run: Time-Travel Adventure — a colorful Three.js action platformer." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hero Run: Time-Travel Adventure</title>
  </head>
  <body>
    <main id="game-root">
      <div id="game-canvas" aria-label="Hero Run 3D platform game"></div>

      <section id="hud" class="hud hidden" aria-label="Game status">
        <div class="hud-card health-card">
          <div class="stat-line"><span>SHIN · HEALTH</span><strong id="health-value">100</strong></div>
          <div class="health-track"><div id="health-fill"></div></div>
          <div class="collect-row">
            <span>🪙 <b id="coins-value">0</b></span>
            <span>💎 <b id="shards-value">0</b></span>
          </div>
        </div>
        <div class="level-label" id="level-name">SUNNY NEIGHBORHOOD · LEVEL 1 / 40</div>
        <button id="pause-button" class="icon-button" type="button" aria-label="Pause game">Ⅱ</button>
      </section>

      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

      <section id="overlay" class="overlay">
        <div class="panel">
          <div class="eyebrow">THREE.JS · 3D PLATFORM ADVENTURE</div>
          <h1 id="overlay-title">HERO <em>RUN</em></h1>
          <p id="overlay-message">Help Shin recover the Time Shard in Sunny Neighborhood.</p>
          <button id="start-button" class="primary-button" type="button">START LEVEL</button>
          <div class="controls-note">Move: A / D or ◀ / ▶ · Jump: Space / W · Toy Star: J · Star Burst: K</div>
          <div id="status-note" class="status-note">LEVEL 1 · SUNNY NEIGHBORHOOD</div>
        </div>
      </section>

      <nav id="touch-controls" class="touch-controls hidden" aria-label="Touch game controls">
        <div class="touch-cluster left-cluster">
          <button type="button" data-action="left" aria-label="Move left">◀</button>
          <button type="button" data-action="right" aria-label="Move right">▶</button>
        </div>
        <div class="touch-cluster right-cluster">
          <button type="button" data-action="attack" aria-label="Throw Toy Star">STAR</button>
          <button type="button" data-action="special" aria-label="Star Burst">BURST</button>
          <button type="button" data-action="jump" aria-label="Jump">JUMP</button>
        </div>
      </nav>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
